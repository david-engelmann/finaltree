[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finaltree"
version = "0.1.0"
description = "Provenance for gate results, fingerprinting the exact tree under test"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
finaltree = "finaltree.cli:main"

[tool.setuptools.packages.find]
include = ["finaltree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
