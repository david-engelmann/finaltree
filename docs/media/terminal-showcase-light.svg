<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="finaltree terminal run over synthetic examples">
  <title>finaltree terminal showcase stamping a gate log and catching post-gate edits</title>
  <rect width="920" height="420" rx="16" fill="#faf9f6" stroke="#d6d3cd" stroke-width="1.5"/>
  <rect width="920" height="38" rx="16" fill="#efede8"/>
  <rect y="22" width="920" height="16" fill="#efede8"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="19" r="6" fill="#22c55e"/>
  <text x="460" y="23" text-anchor="middle" fill="#57534e" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="600">finaltree stamp tree --log stamped.log -- sh gate.sh &amp;&amp; finaltree verify stamped.log tree</text>

  <g font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12.5">
    <text x="24" y="66" fill="#b45309" font-weight="700">$</text>
    <text x="40" y="66" fill="#1c1917">finaltree stamp tree --log stamped.log -- sh gate.sh &amp;&amp; cat stamped.log</text>

    <text x="24" y="94" fill="#b45309" font-weight="700">finaltree-stamped-log/1</text>
    <text x="24" y="114" fill="#44403c">fingerprint ea30bdcfcff91b034c09dde045eed59ea966b810900a27e3a3f2f359494dafb8</text>
    <text x="24" y="134" fill="#44403c">command-json ["sh", "gate.sh"]</text>
    <text x="24" y="154" fill="#15803d">exit-code 0</text>
    <text x="24" y="174" fill="#44403c">evidence-digest 82e0becf6b7142cb55cfe420bdaf03602d29b7e08617ad189525248464c30910</text>
    <text x="24" y="194" fill="#1d4ed8">begin-output</text>
    <text x="24" y="214" fill="#1c1917">ea30bdcfcff91b034c09dde045eed59ea966b810900a27e3a3f2f359494dafb8 | 12 tests ran</text>
    <text x="24" y="234" fill="#1c1917">ea30bdcfcff91b034c09dde045eed59ea966b810900a27e3a3f2f359494dafb8 | 12 passed</text>
    <text x="24" y="254" fill="#1d4ed8">end-output</text>

    <text x="24" y="286" fill="#b45309" font-weight="700">$</text>
    <text x="40" y="286" fill="#1c1917">finaltree verify stamped.log tree</text>
    <text x="24" y="308" fill="#15803d" font-weight="700">match</text>

    <text x="24" y="338" fill="#b45309" font-weight="700">$</text>
    <text x="40" y="338" fill="#1c1917">printf 'beta changed\n' &gt; tree/b.txt &amp;&amp; finaltree verify stamped.log tree</text>
    <text x="24" y="360" fill="#dc2626" font-weight="700">mismatch</text>
    <text x="24" y="380" fill="#b91c1c">file content changed b.txt</text>
    <text x="24" y="400" fill="#b91c1c">dirty file added b.txt (modified)</text>
  </g>
</svg>
