<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="finaltree social preview card">
  <title>finaltree cryptographic gate log provenance</title>
  <rect width="1280" height="640" fill="#141413"/>
  <rect x="36" y="36" width="1208" height="568" rx="28" fill="#1b1a17" stroke="#35322d" stroke-width="2"/>
  <rect x="84" y="88" width="176" height="36" rx="18" fill="#2b2111" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="108" cy="106" r="5" fill="#f59e0b"/>
  <text x="124" y="111" fill="#fbbf24" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1">GATE TRUTH ARC</text>

  <text x="84" y="210" fill="#f5f2eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-1.8">finaltree</text>
  <text x="84" y="274" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="31" font-weight="700">Cryptographic provenance for gate logs and merge candidates.</text>
  <text x="84" y="334" fill="#d6d3d1" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="84" dy="0">Fingerprint HEAD, working and staged blobs, untracked files,</tspan>
    <tspan x="84" dy="36">modes, generated artifacts, and submodules under SHA-256,</tspan>
    <tspan x="84" dy="36">and bind that digest to every line your gate prints.</tspan>
  </text>

  <g font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="16" fill="#a8a29e">
    <rect x="84" y="476" width="270" height="54" rx="12" fill="#24221f" stroke="#3f3c37"/>
    <text x="219" y="509" text-anchor="middle" fill="#f5f2eb">Local Git only</text>
    <rect x="374" y="476" width="290" height="54" rx="12" fill="#24221f" stroke="#3f3c37"/>
    <text x="519" y="509" text-anchor="middle" fill="#f5f2eb">Tamper-evident logs</text>
    <rect x="684" y="476" width="310" height="54" rx="12" fill="#24221f" stroke="#3f3c37"/>
    <text x="839" y="509" text-anchor="middle" fill="#f5f2eb">Exact member-level diffs</text>
  </g>
</svg>
